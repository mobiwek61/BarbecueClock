<!-- v6  June 2026 
     An svg file defines lines, shapes and fonts. AI was used to do the tedious layout tasks to make this clock face.
     It also read all the manuals to see how to do it, so I didn't have to, but now you can modify the code.
     Other elements were added, but you can remove them with comments as you see around this text block.
     This file prints aligned and sized properly in ms-edge, with room at sides for scotch tape.
     To get ms-edge to print desired diameter and offset-x, in viewbox tag, manually increase width,height and 
     then increase viewbox-x to center it (increasing moves everything left!). Test with edge print dialog-it shows a preview. 
     To install, cut out a hole for the shafts and cut a slot to mount; tape the slot, and now do alignment:
       Reset the clock so hands go to 12:00 while it waits for a signal and align dial but don't tape down. Next day hands should show
       the true time: at exact minute, assure that minute hand is correctly over the tick, AND the shafts are exactly in the 
       alignment crosshair. Then tape down, sparingly, as you may have it wrong.
     Tip: to get wwvb signal from Colorado, align clock perpendicular to Colorado, as the ferrite rod antenna is aligned sideways to
       the radio wave, and thus gets maximum entergy. 
-->

